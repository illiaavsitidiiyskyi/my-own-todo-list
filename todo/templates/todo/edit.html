{% extends "base.html" %}

{% block title %}Edit task - TODO-LIST{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h4 class="mb-4"><i class="bi bi-pencil"></i> Edit task</h4>
        <form method="POST">
            <div class="mb-3">
                <label for="title" class="form-label">The name of the task</label>
                <input type="text" class="form-control" id="title" name="title" value="{{ todo.title }}" required>
            </div>
            <div class="mb-3">
                <label for="deadline" class="form-label">Deadline</label>
                <input type="datetime-local" class="form-control" id="deadline" name="deadline"
                       value="{% if todo.deadline %}{{ todo.deadline.strftime('%Y-%m-%dT%H:%M') }}{% endif %}">
            </div>
            <div class="mb-3">
                <label for="weight" class="form-label">Importance</label>
                <select class="form-select" id="weight" name="weight">
                    <option value="1" {% if todo.weight == 1 %}selected{% endif %}>1 - low</option>
                    <option value="2" {% if todo.weight == 2 %}selected{% endif %}>2 - Below average</option>
                    <option value="3" {% if todo.weight == 3 %}selected{% endif %}>3 - average</option>
                    <option value="4" {% if todo.weight == 4 %}selected{% endif %}>4 - High</option>
                    <option value="5" {% if todo.weight == 5 %}selected{% endif %}>5 - Critical</option>
                </select>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> save
                </button>
                <a href="{{ url_for('todo.index') }}" class="btn btn-secondary">
                    <i class="bi bi-x-lg"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
